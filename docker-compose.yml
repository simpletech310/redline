

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: redline
      POSTGRES_USER: redline
      POSTGRES_PASSWORD: redline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redline"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://redline:redline@db:5432/redline
      SECRET_KEY: redline-dev-secret-key
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app

volumes:
  pgdata:
